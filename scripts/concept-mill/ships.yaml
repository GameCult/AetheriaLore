# The Concept Mill's source data. `node scripts/concept-mill/build.mjs` turns it
# into the page's manifest (site/quartz/components/data/conceptMill.json) and
# the render derivatives in Aetheria/media/concept-mill/. Commit all three.
#
# Adding a render round: add one variant row per new render, with `source`
# naming the render's PNG and .md record (without extension) under the renders
# root, then run the build. The renders root defaults to
# Aetheria/Brainstorming/Renders; pass `--renders <dir>` to read another
# checkout. Move `pick: true` if the lab's choice changed, and update a ship's
# status only with the operator's word.
#
# status.kind places a ship in the menu: pass -> Kept, new -> Unreviewed,
# scrap -> Scrap bin. status.stamp and status.verdict only ever carry the
# operator's word, or say plainly that she has not given one.
#
# Each variant is one render. `image` is the derivative basename in
# Aetheria/media/concept-mill/; `source` is the original render (PNG and its
# .md record) relative to the renders root, for variants the build ingests.
# `pick: true` marks the lab's choice (shown as LAB PICK and opened first).
# `operator` holds a verdict the operator gave on that render, verbatim.

# The vote slot in the readout stays hidden until this is enabled and an
# endpoint exists (planned: Bifrost vote API, concept-mill-votes-plan.md).
votes:
  enabled: false
  endpoint: null
  bifrostUrl: null

